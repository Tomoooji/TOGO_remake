; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
;platform = espressif32
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
platform = https://github.com/Jason2866/platform-espressif32.git
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++20
lib_deps = 
	madhephaestus/ESP32Encoder@^5.0.0
	;madhephaestus/ESP32Servo@^3.2.1
	https://github.com/Tomoooji/MotorDriver#dev/rewrite
	https://github.com/Tomoooji/mathmatics_tmj
	https://github.com/Tomoooji/PCA9685_tmj
	https://github.com/Tomoooji/Ultrasonic-Sensor#dev/rewrite

[env:main]
build_src_filter = -<*>+<main.cpp>

[env:ultrasonic]
build_src_filter = -<*>+<check_ultrasonic.cpp>

[env:linear_actuator]
build_src_filter = -<*>+<check_linear_actuator.cpp>

[env:rotary_actuator]
build_src_filter = -<*>+<check_rotary_actuator.cpp>

[env:hand]
build_src_filter = -<*>+<check_hand.cpp>